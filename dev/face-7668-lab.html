<!doctype html><base href="/"><meta charset="utf-8"><title>7668 현장 얼굴 검출 재현</title>
<style>body{background:#222;color:white;font:15px system-ui}canvas{width:300px;border:1px solid #555}pre{white-space:pre-wrap}</style>
<input id="fixture" type="file" accept="image/*"><button id="run">실제 모델 확대 범위 비교</button><pre id="status">파일 선택 대기</pre><div id="results"></div>
<script type="module">
import {FaceLandmarker,FilesetResolver} from '@mediapipe/tasks-vision';
const file=document.querySelector('#fixture'),status=document.querySelector('#status'),results=document.querySelector('#results');
document.querySelector('#run').onclick=async()=>{try{
 status.textContent='초기화';results.replaceChildren();
 const model=await FaceLandmarker.createFromOptions(await FilesetResolver.forVisionTasks('/mediapipe/wasm'),{baseOptions:{modelAssetPath:'/models/face_landmarker.task',delegate:'GPU'},runningMode:'IMAGE',numFaces:3,minFaceDetectionConfidence:.35,minFacePresenceConfidence:.3,minTrackingConfidence:.3,outputFaceBlendshapes:true,outputFacialTransformationMatrixes:true});
 const bitmap=await createImageBitmap(file.files[0]);
 const source=document.createElement('canvas');source.width=300;source.height=150;source.getContext('2d').drawImage(bitmap,494,1082,300,150,0,0,300,150);bitmap.close();results.append(source);
 const rows=[];
 for(const [name,x,y,w,h,filter] of [
 ['full',0,0,300,150,'none'],['center-existing',75,0,150,150,'grayscale(1) contrast(1.3) brightness(1.2)'],
 ['center-half-upper-gray',112.5,0,75,75,'grayscale(1) contrast(1.3) brightness(1.2)'],
 ['center-half-middle-gray',112.5,37.5,75,75,'grayscale(1) contrast(1.3) brightness(1.2)'],
 ['center-half-upper-raw',112.5,0,75,75,'none'],
 ['center-threequarter-upper',93.75,0,112.5,112.5,'grayscale(1) contrast(1.3) brightness(1.2)'],
 ]){
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=Math.round(512*h/w);
 const ctx=canvas.getContext('2d');ctx.filter=filter;ctx.drawImage(source,x,y,w,h,0,0,canvas.width,canvas.height);ctx.filter='none';
 const r=model.detect(canvas),boxes=r.faceLandmarks.map(l=>{const xs=l.map(p=>p.x),ys=l.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}});
 ctx.strokeStyle='lime';ctx.lineWidth=2;for(const b of boxes)ctx.strokeRect(b.x*canvas.width,b.y*canvas.height,b.w*canvas.width,b.h*canvas.height);
 const label=document.createElement('div');label.textContent=name;results.append(label,canvas);rows.push({name,faces:boxes.length,boxes});
 }
 model.close();status.textContent=JSON.stringify(rows,null,2);
}catch(e){status.textContent=String(e);throw e;}};
</script>
