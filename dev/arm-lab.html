<!doctype html>
<html lang="ko"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Codex 팔 리그 검증</title>
<style>body{margin:0;font:14px system-ui;color:#fff}#app{position:fixed;inset:0}nav{position:fixed;z-index:3;left:12px;top:12px;right:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;background:#17212de8;border-radius:12px}select,button{font:inherit;padding:6px}#status{position:fixed;z-index:3;bottom:12px;left:12px;white-space:pre-wrap;background:#17212de8;padding:12px;border-radius:10px}</style></head>
<body><div id="app"></div><nav><strong>Codex · 원본 팔 검증</strong>
<label>동작 <select id="pose"><option value="tracking">가림·불확실 검출·재검출</option><option value="rest">내리기</option><option value="side">옆으로 벌리기</option><option value="up">만세</option><option value="elbow">팔꿈치 굽히기</option><option value="elbowflex">팔꿈치 굽혔다 펴기</option><option value="front">앞으로 뻗기</option><option value="wave">한 손 인사</option><option value="bothgreet">양팔 대칭 인사</option><option value="straightlift">편 팔 그대로 들기</option><option value="palmwave">손바닥 정면 인사</option><option value="waveleft">반대손 인사</option><option value="greet">들고 내리기</option><option value="sweep">연속 움직임</option><option value="nearhead">머리 가까이</option><option value="reachin">머리 안쪽 들기</option><option value="reachsweep">안쪽 들기 연속</option><option value="cross">가로지르기</option><option value="waist">허리 앞 손</option><option value="belly">허리 주변 움직임</option><option value="clap">양손 모으기</option><option value="fold">깊은 굽힘 경계</option><option value="foldrecover">깊은 굽힘 복귀</option></select></label>
<label>시점 <select id="view"><option value="0">정면</option><option value="45">45도</option><option value="90">측면</option><option value="180">뒤</option></select></label>
<label>표현 <select id="look"><option value="surface">표면 확인</option><option value="fur">털 포함</option><option value="final">유화 포함</option></select></label>
<label>범위 <select id="range"><option value="3">전체</option><option value="1.2">기존 제한</option></select></label>
<button id="capture">PNG 저장</button>
<button id="record">영상 저장</button>
<label><input type="checkbox" id="hold">동작 정지</label>
</nav><div id="status">로딩 중</div><script type="module">
import * as THREE from 'three';
import {loadConfig} from '/src/config.ts';
import {PuuvillaCharacter} from '/src/character/puuvilla.ts';
import {NEUTRAL_PARAMS} from '/src/character/mapping.ts';
import {Scene} from '/src/scene.ts';
import {Backdrop} from '/src/backdrop.ts';
import {standingWavePose} from '/src/standingWave.ts';
import {BodyProcessor} from '/src/body.ts';
import {BodyProcessor as BeforeTracking} from '/dev/body-before-v24.ts';
import {armTrackingFixture} from '/dev/arm-tracking-fixture.ts';
const cfg=JSON.parse(JSON.stringify(await loadConfig('/config.json')).replaceAll('./models/','/models/'));
cfg.body.armRig=new URLSearchParams(location.search).get('rig')==='legacy'?'legacy':'connected';
cfg.body.armDeform='surface';cfg.body.armRigPath='/models/stand_connected_rig.json';
if(new URLSearchParams(location.search).get('deform')==='cage'){cfg.body.armDeform='cage';cfg.body.armRigPath='/models/stand_connected_cage_rig.json';}
if(new URLSearchParams(location.search).get('elbow')==='dq')cfg.body.armCageRounded=false;
cfg.body.armHeadClearance=['1','target'].includes(new URLSearchParams(location.search).get('clearance'));
cfg.body.armHeadContact=new URLSearchParams(location.search).get('clearance')!=='target';
cfg.body.armPawHold=new URLSearchParams(location.search).get('pawhold')==='1';
cfg.body.armContinuousAzimuth=new URLSearchParams(location.search).get('azimuth')==='1';
cfg.body.armUpperClearance=new URLSearchParams(location.search).get('upperclear')==='1';
cfg.body.armShoulderMetric=new URLSearchParams(location.search).get('shouldermetric')==='1';
cfg.body.armPawFrame=new URLSearchParams(location.search).get('pawframe')==='1';
cfg.body.armFollowPose=new URLSearchParams(location.search).get('followpose')==='1';
if(new URLSearchParams(location.search).has('rollstart'))cfg.body.armPawRollStart=Math.max(.15,Math.min(.65,Number(new URLSearchParams(location.search).get('rollstart'))));
cfg.body.armElbowPlane=new URLSearchParams(location.search).get('elbowplane')==='1';
cfg.body.armPawContact=new URLSearchParams(location.search).get('pawcontact')==='1';
cfg.body.armTorsoClearance=new URLSearchParams(location.search).get('bodyclear')==='1';
if(new URLSearchParams(location.search).get('weights')==='sections')cfg.body.armRigPath='/models/stand_connected_rig_sections.json';
if(new URLSearchParams(location.search).get('weights')==='portrait')cfg.body.armRigPath='/models/stand_connected_rig_portrait.json';
const socketTest=new URLSearchParams(location.search).get('socket');
if(['12','zero','pivot','fair','arap','arapcap','arapsolid','araplift','araprelative','wrap','wrapsolve','wrapfair','wrapsoft','wrapraw','mirrorleft'].includes(socketTest))cfg.body.armRigPath=`/dev/stand_socket_${socketTest}.json`;
cfg.character.modelPath='/models/pu_stand.obj'; cfg.outfit.seatBody=false; cfg.outfit.sitBody=false;cfg.outfit.style='christmas';
if(new URLSearchParams(location.search).get('candidate')==='posefirst'){cfg.character.modelPath='/dev/stand_pose_first_preview.obj';cfg.body.armRig='legacy';}
if(new URLSearchParams(location.search).get('candidate')==='posefirstwrap'){cfg.character.modelPath='/dev/stand_pose_first_wrap.obj';cfg.body.armRig='legacy';}
cfg.body.enabled=true;cfg.body.armRaiseMaxRad=3;cfg.character.idleBreathAmp=0;
cfg.scene.layout='landscape';cfg.scene.viewCenterCm=103;cfg.scene.viewHeightCm=220;cfg.scene.aspect=1.35;cfg.scene.cameraTiltDeg=0;
if(new URLSearchParams(location.search).get('crop')==='portrait'){cfg.scene.viewCenterCm=128;cfg.scene.viewHeightCm=155;cfg.scene.aspect=1.26;}
if(new URLSearchParams(location.search).get('crop')==='baseline'){cfg.scene.viewCenterCm=133;cfg.scene.viewHeightCm=90;cfg.scene.aspect=16/9;cfg.scene.cameraTiltDeg=-6;}
cfg.filter.enabled=false;cfg.filter.oil.enabled=false;
cfg.scene.bgTop='#6b7680';cfg.scene.bgBottom='#48535e';
const scene=new Scene(document.querySelector('#app'),cfg.scene,cfg.character,cfg.filter);
let backdrop=null;
if(new URLSearchParams(location.search).get('bg')==='winter'){
 backdrop=new Backdrop({top:cfg.scene.bgTop,bottom:cfg.scene.bgBottom});
 await backdrop.set('winter',false);scene.backdrop=backdrop;
}
scene.renderer.setPixelRatio(1);
const character=await PuuvillaCharacter.load(cfg);
if(new URLSearchParams(location.search).has('turn'))character.debugPawTurn=Number(new URLSearchParams(location.search).get('turn'))*Math.PI/180;
scene.scene.add(character.root);character.setShellCount(0);scene.ready=true;
const controls={pose:document.querySelector('#pose'),view:document.querySelector('#view'),look:document.querySelector('#look'),range:document.querySelector('#range')};
const qp=new URLSearchParams(location.search);
let trackingProcessor=new (qp.get('tracking')==='before'?BeforeTracking:BodyProcessor)(cfg);
const reviewTag=(qp.has('tracking')?'codex-v24-tracking-'+qp.get('tracking'):socketTest==='mirrorleft'?'codex-v23-mirror-left':qp.get('followpose')==='1'?'codex-v22-follow-pose':qp.get('pawframe')==='1'?'codex-v21-paw-frame'+(socketTest?'-'+socketTest:''):['wrapsoft','wrapraw','mirrorleft'].includes(socketTest)?'codex-v20-'+socketTest:qp.has('rollstart')?'codex-v19-roll-'+qp.get('rollstart').replaceAll('.','p'):qp.get('shouldermetric')==='1'?'codex-v18-shoulder-metric':qp.get('upperclear')==='1'?'codex-v17-upper-contact':qp.get('elbowplane')==='1'?'codex-v15-elbow-plane':qp.get('pawcontact')==='1'?'codex-v14-paw-contact':qp.get('bodyclear')==='1'?'codex-v13-torso':qp.has('curve')?'codex-v12-curve':qp.get('azimuth')==='1'?'codex-v11-azimuth':qp.get('pawhold')==='1'?'codex-v10-paw-hold':qp.has('palm')?'codex-v9-paw-drop':qp.has('clearance')?'codex-v9-contact':qp.get('deform')==='cage'?`codex-v8-${qp.get('elbow')==='dq'?'cage':'rounded-cage'}-${socketTest??'base'}`:qp.get('candidate')==='posefirstwrap'?'codex-v8-posefirstwrap':qp.get('candidate')==='posefirst'?'codex-v6-posefirst':socketTest?`codex-v8-socket-${socketTest}`:'codex-v7')+(qp.has('upper')?`-upper${qp.get('upper').replaceAll('.','p')}`:'')+(qp.has('bend')?`-bend${qp.get('bend').replaceAll('.','p')}`:'')+(qp.has('time')?`-t${qp.get('time').replaceAll('.','p')}`:'')+(qp.has('head')?'-head':'')+(qp.has('torso')?'-torso':'');
if(qp.get('source')==='1')document.querySelector('#record').disabled=true;
let recordEpoch=null;
document.querySelector('#hold').checked=qp.get('hold')==='1';
for(const key of Object.keys(controls))if(qp.has(key))controls[key].value=qp.get(key);
function applyControls(){
 character.root.rotation.y=Number(controls.view.value)*Math.PI/180;
 character.setShellCount(controls.look.value==='surface'?0:14);
 cfg.filter.oil.enabled=controls.look.value==='final';cfg.body.armRaiseMaxRad=Number(controls.range.value);
}
Object.values(controls).forEach(el=>el.addEventListener('change',applyControls));applyControls();
document.querySelector('#capture').addEventListener('click',async()=>{
 scene.render();const src=controls.look.value==='final'?document.querySelector('#app + canvas'):scene.renderer.domElement,out=document.createElement('canvas');out.width=src.width;out.height=src.height;
 const ctx=out.getContext('2d'),bg=ctx.createLinearGradient(0,0,0,out.height);bg.addColorStop(0,cfg.scene.bgTop);bg.addColorStop(1,cfg.scene.bgBottom);
 ctx.fillStyle=bg;ctx.fillRect(0,0,out.width,out.height);if(backdrop)ctx.drawImage(backdrop.canvas,0,0,out.width,out.height);ctx.drawImage(src,0,0);
 const name=`${reviewTag}-${qp.get('crop')??'full'}-${qp.get('source')==='1'?'source':controls.pose.value}-${controls.view.value}`;
 const response=await fetch('/__mimic/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,data:out.toDataURL('image/png')})});
 document.querySelector('#capture').textContent=response.ok?'PNG 기록 완료':'저장 실패';
});
document.querySelector('#record').addEventListener('click',()=>{
 const button=document.querySelector('#record');button.disabled=true;button.textContent='녹화 중';
 const name=`${reviewTag}-${controls.pose.value}-${controls.view.value}`;
 const duration=controls.pose.value==='belly'?24000:['tracking','greet','sweep','nearhead','clap','foldrecover','elbowflex','reachsweep','palmwave','straightlift','bothgreet'].includes(controls.pose.value)?12000:['wave','waveleft'].includes(controls.pose.value)?9200:6000;
 const locked=[...document.querySelectorAll('select,input,#capture')];locked.forEach(el=>el.disabled=true);
 document.querySelector('#hold').checked=false;
 recordEpoch=performance.now()+700;
 character.resetArmContact();
 trackingProcessor=new (qp.get('tracking')==='before'?BeforeTracking:BodyProcessor)(cfg);
 const src=controls.look.value==='final'?document.querySelector('#app + canvas'):scene.renderer.domElement;
 const stream=src.captureStream(30),chunks=[];
 const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:5000000});
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 recorder.onstop=async()=>{
  recordEpoch=null;
  stream.getTracks().forEach(track=>track.stop());
  const data=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(new Blob(chunks,{type:'video/webm'}));});
  const response=await fetch('/__mimic/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,data})});
  button.textContent=response.ok?'영상 기록 완료':'영상 저장 실패';button.disabled=false;
  locked.forEach(el=>el.disabled=false);
 };
 setTimeout(()=>{recorder.start();setTimeout(()=>recorder.stop(),duration);},700);
});
function pose(t){
 if(controls.pose.value==='wave')return standingWavePose(t);
 if(controls.pose.value==='waveleft')return standingWavePose(t,1,1);
 if(controls.pose.value==='bothgreet'){
  const phase=t%12,a=document.querySelector('#hold').checked?1:phase<2?phase/2:phase<8?1:phase<10?1-(phase-8)/2:0,amount=a*a*(3-2*a);
  const r=standingWavePose(t,amount,-1),l=standingWavePose(t,amount,1);
  return {...r,shoulderL:l.shoulderL,elbowL:l.elbowL,wristL:l.wristL,handDirectionL:l.handDirectionL};
 }
 if(controls.pose.value==='greet'){
  const phase=t%12;let a=phase<2?phase/2:phase<8?1:phase<10?1-(phase-8)/2:0;
  return standingWavePose(t,a*a*(3-2*a));
 }
 const result={hipL:[.1,0,0],hipR:[-.1,0,0],armL:1,armR:1,hips:1};
 const mode=controls.pose.value;
 const clapClose=document.querySelector('#hold').checked?1:(1-Math.cos(t*Math.PI/3))/2;
 for(const side of [-1,1]){
  const name=side>0?'L':'R'; let theta=0,phi=0,bend=0;
  if(mode==='nearhead'){theta=2.65;bend=1.05;phi=.2;}
  if(mode==='reachin'){theta=Number(qp.get('upper')??2.5);phi=Number(qp.get('phi')??2);bend=0;}
  if(mode==='reachsweep'){theta=2.3+.3*Math.sin(t*.8);phi=1.7+.3*Math.sin(t*.5);bend=0;}
  if(mode==='side')theta=Math.PI/2;
  if(mode==='up')theta=2.85;
  if(mode==='front'){theta=Math.PI/2;phi=Math.PI/2;}
  const phase=t%12,rawLift=document.querySelector('#hold').checked?1:phase<2?phase/2:phase<8?1:phase<10?1-(phase-8)/2:0;
  const palmLift=rawLift*rawLift*(3-2*rawLift);
  if(mode==='palmwave'){theta=1.5*palmLift;phi=1.57*palmLift;}
  if(mode==='straightlift'){theta=Number(qp.get('upper')??2.95)*palmLift;phi=Number(qp.get('phi')??1.57);}
  if(mode==='elbow'){theta=.25;bend=Number(qp.get('bend')??1.8);phi=.1;}
  if(mode==='elbowflex'){theta=.25;bend=1.2*(1-Math.cos(t*Math.PI/3));phi=.1;}
  if(mode==='clap'){theta=1.2;phi=1.3+.7*clapClose;}
  if(mode==='fold'){theta=1.5;phi=0;bend=Math.PI+Math.sin(t*3)*.02;}
  if(mode==='foldrecover'){theta=1.5;phi=0;const phase=t%12,ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};bend=phase<3?Math.PI*ease(phase/3):phase<6?Math.PI+Math.sin((phase-3)*3)*.02:Math.PI*(1+ease((phase-6)/3));}
  if(mode==='cross'){theta=1.5;phi=Math.PI+Math.sin(t*3)*.03;bend=.2;}
  if(mode==='belly'){theta=(Math.sin(t*.7+side*.4)+1)*.75;bend=-(Math.sin(t*1.1)+1)*1.2;phi=Math.sin(t*.4)*.35;}
  if(mode==='waist'){theta=Number(qp.get('upper')??1.25);phi=.15;bend=Number(qp.get('bend')??-1.75)+Math.sin(t*1.5)*.15;}
  if(mode==='wave'&&side<0){theta=Number(qp.get('raise')??2.18);phi=.08;bend=2.86-theta+Math.sin(t*2.5)*.08;}
  if(mode==='sweep'){theta=(Math.sin(t*.7+side*.4)+1)*1.4;bend=(Math.sin(t*1.1)+1)*.65;phi=(Math.sin(t*.4)+1)*.35;}
  const s=new THREE.Vector3(side*.18,.48,0);
  const dir=new THREE.Vector3(side*Math.sin(theta)*Math.cos(phi),-Math.cos(theta),Math.sin(theta)*Math.sin(phi));
  const e=s.clone().addScaledVector(dir,.27);
  const axis=['elbow','elbowflex'].includes(mode)?new THREE.Vector3(-1,0,0):new THREE.Vector3(0,0,side);
  const fore=dir.clone().applyAxisAngle(axis,bend);
  if(mode==='palmwave'){
   const raised=new THREE.Vector3(side*.2,.96,.2).normalize();
   fore.applyQuaternion(new THREE.Quaternion().slerp(new THREE.Quaternion().setFromUnitVectors(dir,raised),palmLift));
   result['handAcross'+name]=fore.clone().cross(new THREE.Vector3(0,0,1)).multiplyScalar(-side).normalize().toArray();
   result['handDirection'+name]=fore.toArray();
  }
  if(mode==='straightlift'){
   result['handAcross'+name]=fore.clone().cross(new THREE.Vector3(0,0,1)).multiplyScalar(-side).normalize().toArray();
   result['handDirection'+name]=fore.toArray();
  }
  if(mode==='nearhead')fore.set(side*Math.sin(3.7)*Math.cos(phi),-Math.cos(3.7),Math.sin(3.7)*Math.sin(phi));
  if(mode==='clap'){fore.copy(dir).lerp(new THREE.Vector3(-side,0,.3).normalize(),clapClose).normalize();}
  const w=e.clone().addScaledVector(fore,.25);
  result['shoulder'+name]=s.toArray();result['elbow'+name]=e.toArray();result['wrist'+name]=w.toArray();
 }
 return result;
}
let last=performance.now(),frames=0,stamp=last;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 const poseTime=recordEpoch===null?now/1000:Math.max(0,(now-recordEpoch)/1000);
 const t=document.querySelector('#hold').checked?Number(qp.get('time')??0):poseTime;
 let input=pose(qp.has('palm')&&controls.pose.value==='wave'?0:t),face={...NEUTRAL_PARAMS};
 if(qp.has('head')){face.headYaw=.6*Math.sin(t*.9);face.headPitch=.25*Math.sin(t*.7);face.headRoll=.2*Math.sin(t*1.3);}
 if(qp.get('head')==='fast'){face.headYaw=.65*Math.sin(t*4);face.headPitch=.3*Math.sin(t*3);face.headRoll=.2*Math.sin(t*5);}
 if(qp.get('palm')==='drop'){
  const f=new THREE.Vector3(...input.wristR).sub(new THREE.Vector3(...input.elbowR)).normalize();
  const across=new THREE.Vector3(1,0,0);across.addScaledVector(f,-across.dot(f)).normalize().applyAxisAngle(f,.8);
  const valid=Math.floor(t*15)%3!==0 && !(t%8>4 && t%8<5.3);
  if(valid){input.handAcrossR=across.toArray();input.handDirectionR=f.clone().applyAxisAngle(new THREE.Vector3(0,0,1),.12).toArray();}
  else{delete input.handAcrossR;delete input.handDirectionR;}
 }
 if(qp.has('torso')){
  const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(.15*Math.sin(t*.7),.5*Math.sin(t*.8),.2*Math.sin(t*1.1),'YXZ'));
  for(const [key,value] of Object.entries(input))if(Array.isArray(value)&&value.length===3)input[key]=new THREE.Vector3(...value).applyQuaternion(q).toArray();
 }
 if(controls.pose.value==='tracking')input=trackingProcessor.update(armTrackingFixture(t).raw,true,now);
 character.setState({state:'MIMIC',elapsedMs:now,progress:1});if(qp.get('source')!=='1')character.apply(face,dt,now/1000,input);scene.render();frames++;
 if(now-stamp>1000){document.querySelector('#status').textContent=`${qp.get('source')==='1'?'정지 원본/실험':qp.get('deform')==='cage'?'실시간 · 케이지 변형 후 세분화':'연결 원본 · 실시간 변형'} · ${controls.pose.selectedOptions[0].textContent}\n${Math.round(frames*1000/(now-stamp))} fps · 손/어깨/겨드랑이 형태 비교`;frames=0;stamp=now;}
 requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></body></html>
