<!doctype html><base href="/"><meta charset="utf-8"><title>현장 입력 얼굴 검출 검사</title>
<style>body{background:#222;color:white;font:14px monospace}canvas{border:1px solid #555;max-width:600px}pre{white-space:pre-wrap}</style>
<input id="fixture" type="file" accept="image/*"><button id="run">검사</button><button id="pipeline">실제 트래커 검사</button><pre id="status">파일을 선택하세요</pre><div id="results"></div>
<script type="module">
import {FaceLandmarker, FilesetResolver} from '@mediapipe/tasks-vision';
import {FaceTracker} from '/src/tracker.ts';
import {loadConfig} from '/src/config.ts';
import {SignalProcessor} from '/src/signals.ts';
import {MimicStateMachine} from '/src/state.ts';
const file=document.querySelector('#fixture'),status=document.querySelector('#status'),results=document.querySelector('#results');
const region=()=>file.files[0].name.includes('7668')?[494,1082,300,150]:[520,965,350,165];
document.querySelector('#pipeline').onclick=async()=>{
 try{
 results.replaceChildren();status.textContent='실제 트래커 초기화';
 const bitmap=await createImageBitmap(file.files[0]);
 const rect=region(),source=document.createElement('canvas');source.width=rect[2];source.height=rect[3];
 const ctx=source.getContext('2d');ctx.drawImage(bitmap,...rect,0,0,source.width,source.height);bitmap.close();
 results.append(source);
 const rows=[];
 for(const worker of [false,true]){
 const cfg=await loadConfig();cfg.tracker.useWorker=worker;
 cfg.tracker.wasmPath='/mediapipe/wasm';cfg.tracker.modelPath='/models/face_landmarker.task';
 cfg.presence.lockZone={x:0,y:0,w:1,h:1};
 const tracker=new FaceTracker(cfg.tracker);await tracker.init();
 const signal=new SignalProcessor(cfg),fsm=new MimicStateMachine(cfg);
 let count=0,locked=0,last=null,activeFrames=0,firstLockMs=null;const began=performance.now(),frameCount=180;
 for(let i=0;i<frameCount;i++){
 const now=performance.now(),track=tracker.update({readyState:4,currentTime:i/30},now,source);
 const s=signal.update(track,now,source.width/source.height);
 if(fsm.update(s,now).state==='MIMIC')activeFrames++;
 if(track.faces.length)count++;if(signal.debugFaces.some(f=>f.locked)){locked++;if(firstLockMs===null)firstLockMs=Math.round(now-began);}
 if(track.faces.length)last=track.faces[0].bbox;
 await new Promise(r=>setTimeout(r,33));
 }
 const blank=document.createElement('canvas');blank.width=source.width;blank.height=source.height;
 blank.getContext('2d').fillRect(0,0,blank.width,blank.height);
 let blankFaces=0,blankPresent=true;
 for(let i=frameCount;i<frameCount+75;i++){
 const now=performance.now(),track=tracker.update({readyState:4,currentTime:i/30},now,blank);
 const s=signal.update(track,now,source.width/source.height);
 if(i>=frameCount+60)blankFaces+=track.faces.length;
 blankPresent=s.present;
 await new Promise(r=>setTimeout(r,33));
 }
 rows.push({requestedWorker:worker,mode:tracker.mode,frameCount,firstLockMs,detectedFrames:count,lockedFrames:locked,activeFrames,last,blankFaces,blankPresent});
 tracker.close();const shown=document.createElement('canvas');shown.width=source.width;shown.height=source.height;const sc=shown.getContext('2d');sc.drawImage(source,0,0);if(last){sc.strokeStyle='lime';sc.lineWidth=2;sc.strokeRect(last.x*shown.width,last.y*shown.height,last.w*shown.width,last.h*shown.height);}results.append(shown);status.textContent=JSON.stringify(rows,null,2);
 }
 }catch(e){status.textContent=String(e);throw e;}
};
document.querySelector('#run').onclick=async()=>{
 try{
 status.textContent='모델 초기화';results.replaceChildren();
 const model=await FaceLandmarker.createFromOptions(await FilesetResolver.forVisionTasks('/mediapipe/wasm'),{
 baseOptions:{modelAssetPath:'/models/face_landmarker.task',delegate:'GPU'},runningMode:'IMAGE',numFaces:3,
 minFaceDetectionConfidence:.35,minFacePresenceConfidence:.3,minTrackingConfidence:.3,
 outputFaceBlendshapes:true,outputFacialTransformationMatrixes:true});
 const bitmap=await createImageBitmap(file.files[0]);
 const source=document.createElement('canvas');source.width=350;source.height=165;
 source.getContext('2d').drawImage(bitmap,520,965,350,165,0,0,350,165);
 const rows=[];
 for(const [name,x,y,w,h,filter] of [
 ['full',0,0,350,165,'none'],
 ['full-gray',0,0,350,165,'grayscale(1) contrast(1.3) brightness(1.2)'],
 ['full-gray-only',0,0,350,165,'grayscale(1)'],
 ['center',92,0,165,165,'none'],
 ['center-gray',92,0,165,165,'grayscale(1) contrast(1.3) brightness(1.2)'],
 ]){
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=Math.round(512*h/w);
 const ctx=canvas.getContext('2d');ctx.filter=filter;ctx.drawImage(source,x,y,w,h,0,0,canvas.width,canvas.height);ctx.filter='none';
 const r=model.detect(canvas);
 const boxes=r.faceLandmarks.map(l=>{const xs=l.map(p=>p.x),ys=l.map(p=>p.y);return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}});
 ctx.strokeStyle='lime';ctx.lineWidth=2;for(const b of boxes)ctx.strokeRect(b.x*canvas.width,b.y*canvas.height,b.w*canvas.width,b.h*canvas.height);
 results.append(canvas);rows.push({name,faces:boxes.length,boxes});
 }
 bitmap.close();model.close();status.textContent=JSON.stringify(rows,null,2);
 }catch(e){status.textContent=String(e);throw e;}
};
</script>
