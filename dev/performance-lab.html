<!doctype html><html lang="ko"><head><base href="/"><meta charset="utf-8"><title>v48 성능 비교 · 동일 12fps 유화</title>
<style>body{margin:0;color:white;font:14px system-ui}#app{position:fixed;inset:0}nav{position:fixed;left:12px;top:12px;z-index:20;background:#17212dee;padding:12px;border-radius:8px}button{font:inherit}#status{margin-top:8px}</style>
</head><body><div id="app"></div><nav>동일 모델 · 12fps 유화 · 렌더 비용 비교
<button id="before">기존 렌더 10초</button><button id="after">최적화 렌더 10초</button><pre id="stats"></pre>
<select id="view"><option value="0">정면</option><option value="-45">사선</option><option value="-90">측면</option></select>
<button id="record">10초 영상 저장</button><button id="up">+15° 정지</button><button id="down">−15° 정지</button>
<div id="status">로딩 중</div></nav>
<script type="module">
import {loadConfig} from '/src/config.ts';
import {Scene} from '/src/scene.ts';
import {Backdrop} from '/src/backdrop.ts';
import {PuuvillaCharacter} from '/src/character/puuvilla.ts';
import {mapSignal,NEUTRAL_PARAMS} from '/src/character/mapping.ts';
import {BodyProcessor} from '/src/body.ts';
import {armSessionFixture} from '/dev/arm-session-fixture.ts';
import {SignalProcessor} from '/src/signals.ts';
import {FaceNeutral as Before} from '/dev/face-neutral-before-v47.ts';
import {MimicStateMachine} from '/src/state.ts';
const cfg=await loadConfig();cfg.presence.mimicOnLock=true;cfg.scene.outputMirror=false;cfg.scene.layout='landscape';cfg.scene.viewHeightCm=140;cfg.scene.viewCenterCm=128;
cfg.filter.oil.enabled=true;cfg.filter.oil.fps=12;cfg.filter.oil.split=0;
const scene=new Scene(document.querySelector('#app'),cfg.scene,cfg.character,cfg.filter);
const backdrop=new Backdrop({top:cfg.scene.bgTop,bottom:cfg.scene.bgBottom});await backdrop.set('winter',false);scene.backdrop=backdrop;
const ch=await PuuvillaCharacter.load(cfg);scene.characterOutput.add(ch.root);ch.setShellCount(14);scene.ready=true;
let corrected=true,processor,old,fsm,bodyProc,start,last=performance.now(),freeze=null;
function reset(){processor=new SignalProcessor(cfg);old=new Before();fsm=new MimicStateMachine(cfg);bodyProc=new BodyProcessor(cfg);start=performance.now();freeze=null;}
reset();

let bench=null, savedTake=null, sourceCalls=0;
const originalRender=scene.renderer.render.bind(scene.renderer);
scene.renderer.render=(...args)=>{sourceCalls++;return originalRender(...args);};
for(const [id,optimized] of [['before',false],['after',true]])document.querySelector('#'+id).onclick=()=>{
 reset();corrected=true;scene.render();savedTake??=scene.oil.cadence.take.bind(scene.oil.cadence);
 scene.oil.cadence.take=optimized?savedTake:()=>true;scene.oil.cadence.reset();
 bench={optimized,start:performance.now(),calls:sourceCalls,intervals:[],cpu:[]};
 document.querySelector('#stats').textContent='측정 중';
};

document.querySelector('#view').onchange=e=>{ch.root.rotation.y=Number(e.target.value)*Math.PI/180;};
document.querySelector('#up').onclick=()=>{reset();for(let i=0;i<120;i++)inputs(i/60,start-2000+i*1000/60);freeze=3;};
document.querySelector('#down').onclick=()=>{reset();for(let i=0;i<120;i++)inputs(i/60,start-2000+i*1000/60);freeze=5;};
function inputs(t,now){
 const motion=t<1?0:Math.sin((t-2)*Math.PI/2)*15;
 const raw={bbox:{x:.44,y:.21,w:.12,h:.182,cx:.5,cy:.301},yaw:0,pitch:24+motion,roll:0,blend:{},mouth:{open:.12,corner:.02},eyes:{left:.02,right:.02}};
 const sig=processor.update({faces:[raw],inferenceMs:10,observedAtMs:now},now,16/9);old.update(raw,now);
 if(!corrected)sig.pitch=old.pitch(raw.pitch);
 const phase=t%10,sourceTime=phase<2?phase:phase<6?3:phase<8?16+(phase-6):19;
 const pose=armSessionFixture(sourceTime,true).raw;
 if(phase>2&&phase<6)for(const id of [15,16]){pose.world[id].x+=.025*Math.sin(phase*5);pose.image[id].x+=.025*Math.sin(phase*5)*.65/(16/9);}
 const body=bodyProc.update(pose,true,now),state=fsm.update(sig,now,!!body);
 return {sig,body,state,motion};
}
document.querySelector('#record').onclick=()=>{
 reset();const chunks=[],stream=(scene.oil?.out??scene.renderer.domElement).captureStream(12),recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download=`codex-v48-performance-${corrected?'after':'before'}-${document.querySelector('#view').value}.webm`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);stream.getTracks().forEach(t=>t.stop());};recorder.start();setTimeout(()=>recorder.stop(),10000);
};
function frame(now){
 const frameStart=performance.now();const elapsed=now-last;const dt=Math.min(.05,elapsed/1000);last=now;const t=freeze??Math.min(9.99,(now-start)/1000);
 const {sig,body,state,motion}=inputs(t,now);
 const params=state.state==='MIMIC'||state.state==='ENTER'?mapSignal(sig,cfg.mapping):NEUTRAL_PARAMS;
 ch.setState(state);ch.apply(params,dt,now/1000,body);scene.render();
 document.querySelector('#status').textContent=`${corrected?'수정 후':'수정 전'} | ${t.toFixed(2)}초 | ${state.state} | 눈 기준 ${processor.neutralReady} | 입력 상하 ${motion.toFixed(1)}° | 출력 ${(params.headPitch*180/Math.PI).toFixed(1)}°`;
 
 if(bench){bench.intervals.push(elapsed);bench.cpu.push(performance.now()-frameStart);
 if(now-bench.start>=10000){const sorted=bench.intervals.slice().sort((a,b)=>a-b);
 document.querySelector('#stats').textContent=JSON.stringify({optimized:bench.optimized,seconds:(now-bench.start)/1000,rafFrames:bench.intervals.length,sourceRenders:sourceCalls-bench.calls,mainCpuMs:bench.cpu.reduce((a,b)=>a+b,0),p95FrameMs:sorted[Math.floor(sorted.length*.95)],over50ms:sorted.filter(x=>x>50).length,oilFps:cfg.filter.oil.fps,canvas:[scene.renderer.domElement.width,scene.renderer.domElement.height]},null,2);bench=null;}}
 requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></body></html>
